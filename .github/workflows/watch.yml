name: التقرير المخصص
on:
  workflow_dispatch: {}    # يُشغَّل بزر من التطبيق
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests deep-translator trafilatura
      - run: python watch_job.py
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
